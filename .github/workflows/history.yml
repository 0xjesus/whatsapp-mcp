name: History and transcription

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/history/requirements.lock
      - name: Unit tests
        run: |
          PYTHONPATH=tools/history python -m unittest discover -s tools/history/tests -p 'test_*.py'
          python -m unittest discover -s tools/transcriber -p 'test_*.py'
      - name: Synthetic PostgreSQL installation and pipeline
        env:
          HISTORY_DOCKER_TEST: '1'
          PYTHONPATH: tools/history
        run: python -m unittest discover -s tools/history/tests -p test_integration.py
